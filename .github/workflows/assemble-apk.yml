name: Assemble Android APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout APK chunks
        uses: actions/checkout@v4

      - name: Assemble APK
        shell: bash
        run: cat chunks-v021/apk.part* > hangzhou-trip-v0.2.1.apk

      - name: Verify APK
        shell: bash
        run: |
          test "$(stat -c%s hangzhou-trip-v0.2.1.apk)" -eq 7138646
          test "$(sha256sum hangzhou-trip-v0.2.1.apk | cut -d' ' -f1)" = "ae79365784b200b3b85058a2e46a3afd9fca35d4ba18063076d02bc517d225d5"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.2.1 hangzhou-trip-v0.2.1.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "杭州旅伴 Android v0.2.1" \
            --notes "修复 Android WebView 加载 ES Module 导致的白屏；统一手机与电脑端 PWA 界面，包含日程、备选方案、手绘地图、餐饮、提醒和外部预约/高德导航。包名：com.hangzhou.tripplanner。"
